<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat IA</title>
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171c;
    --panel: #1b1f26;
    --panel-2: #21262f;
    --line: #2c323d;
    --amber: #ffb020;
    --amber-dim: #6b5320;
    --text: #e8e6e1;
    --text-dim: #9aa1ac;
    --user-bubble: #263042;
    --danger: #ff6b5e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-dot{
    width:10px; height:10px; border-radius:3px; background:var(--amber);
    box-shadow:0 0 8px var(--amber);
  }
  .brand-title{
    font-family:'IBM Plex Mono', monospace; font-weight:600;
    letter-spacing:0.04em; font-size:14px; text-transform:uppercase;
  }
  .model-readout{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim);
    letter-spacing:0.03em;
  }
  header button{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    width:36px; height:36px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  header button:hover{ border-color:var(--amber); color:var(--amber); }

  #chat{
    flex:1; overflow-y:auto; padding:18px 14px 10px;
    display:flex; flex-direction:column; gap:12px;
  }
  .msg{
    max-width:82%; padding:10px 13px; border-radius:12px;
    line-height:1.45; font-size:14.5px; white-space:pre-wrap; word-wrap:break-word;
  }
  .msg.user{
    align-self:flex-end; background:var(--user-bubble);
    border-bottom-right-radius:3px;
  }
  .msg.assistant{
    align-self:flex-start; background:var(--panel-2);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }
  .msg.error{
    align-self:flex-start; background:transparent;
    border:1px solid var(--danger); color:var(--danger);
    font-family:'IBM Plex Mono', monospace; font-size:12.5px;
  }
  .msg.thinking{
    align-self:flex-start; color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    letter-spacing:0.03em;
  }
  .empty-state{
    margin:auto; text-align:center; color:var(--text-dim); max-width:320px;
    font-family:'IBM Plex Mono', monospace; font-size:13px; line-height:1.6;
  }
  .empty-state b{ color:var(--amber); }

  #inputbar{
    display:flex; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:var(--panel);
  }
  #inputbar textarea{
    flex:1; resize:none; background:var(--panel-2); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px;
    font-family:'IBM Plex Sans', sans-serif; font-size:14.5px; line-height:1.4;
    max-height:120px;
  }
  #inputbar textarea:focus{ outline:none; border-color:var(--amber); }
  #sendBtn{
    width:46px; border-radius:10px; border:1px solid var(--amber);
    background:var(--amber-dim); color:var(--amber); font-size:18px;
    cursor:pointer;
  }
  #sendBtn:disabled{ opacity:0.4; cursor:default; }
  #sendBtn:not(:disabled):hover{ background:var(--amber); color:#14171c; }

  /* Settings overlay */
  #overlay{
    position:fixed; inset:0; background:rgba(10,11,13,0.72);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  #overlay.open{ display:flex; }
  #settingsPanel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    width:100%; max-width:380px; padding:20px;
  }
  #settingsPanel h2{
    font-family:'IBM Plex Mono', monospace; font-size:13px; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--amber); margin:0 0 16px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;
  }
  .field input, .field select{
    width:100%; background:var(--panel-2); border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:10px 11px; font-size:14px;
    font-family:'IBM Plex Mono', monospace;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--amber); }
  .hint{ font-size:11.5px; color:var(--text-dim); margin-top:6px; line-height:1.5; }
  .hint a{ color:var(--amber); }
  .row{ display:flex; gap:8px; margin-top:18px; }
  .row button{
    flex:1; padding:10px; border-radius:8px; font-size:13px; cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif; font-weight:500;
  }
  #saveSettings{ background:var(--amber); border:1px solid var(--amber); color:#14171c; }
  #closeSettings{ background:none; border:1px solid var(--line); color:var(--text-dim); }
  #clearChat{ background:none; border:1px solid var(--danger); color:var(--danger); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-dot"></div>
    <div>
      <div class="brand-title">Chat IA</div>
      <div class="model-readout" id="modelReadout">—</div>
    </div>
  </div>
  <button id="openSettings" title="Configuración">⚙</button>
</header>

<div id="chat"></div>

<div id="inputbar">
  <textarea id="input" rows="1" placeholder="Escribe un mensaje..."></textarea>
  <button id="sendBtn">➤</button>
</div>

<div id="overlay">
  <div id="settingsPanel">
    <h2>Configuración</h2>
    <div class="field">
      <label for="apiKey">API key de Anthropic</label>
      <input type="password" id="apiKey" placeholder="sk-ant-...">
      <div class="hint">Se guarda solo en este dispositivo (localStorage), nunca se envía a nadie más que a api.anthropic.com. Consíguela en <a href="https://platform.claude.com" target="_blank">platform.claude.com</a>.</div>
    </div>
    <div class="field">
      <label for="modelSelect">Modelo</label>
      <select id="modelSelect">
        <option value="claude-haiku-4-5-20251001">Haiku 4.5 — rápido y barato</option>
        <option value="claude-sonnet-5">Sonnet 5 — uso general</option>
        <option value="claude-opus-4-8">Opus 4.8 — máxima capacidad</option>
      </select>
    </div>
    <div class="row">
      <button id="closeSettings">Cerrar</button>
      <button id="saveSettings">Guardar</button>
    </div>
    <div class="row">
      <button id="clearChat">Borrar conversación</button>
    </div>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const modelReadout = document.getElementById('modelReadout');
const overlay = document.getElementById('overlay');

const STORAGE_KEY = 'chatia.apiKey';
const MODEL_KEY = 'chatia.model';
const MESSAGES_KEY = 'chatia.messages';
const MODEL_LABELS = {
  'claude-haiku-4-5-20251001': 'Haiku 4.5',
  'claude-sonnet-5': 'Sonnet 5',
  'claude-opus-4-8': 'Opus 4.8'
};

let apiKey = localStorage.getItem(STORAGE_KEY) || '';
let model = localStorage.getItem(MODEL_KEY) || 'claude-haiku-4-5-20251001';
let messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');

function saveMessages(){
  localStorage.setItem(MESSAGES_KEY, JSON.stringify(messages));
}

function updateReadout(){
  modelReadout.textContent = MODEL_LABELS[model] || model;
}

function renderChat(){
  chatEl.innerHTML = '';
  if(messages.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = apiKey
      ? 'Escribe abajo para empezar.<br>Modelo activo: <b>' + (MODEL_LABELS[model]||model) + '</b>'
      : 'Primero abre <b>⚙ Configuración</b><br>y pega tu API key de Anthropic.';
    chatEl.appendChild(empty);
    return;
  }
  messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + m.role;
    div.textContent = m.content;
    chatEl.appendChild(div);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}

function autoGrow(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}
inputEl.addEventListener('input', autoGrow);

inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  if(!apiKey){
    openSettingsPanel();
    return;
  }
  messages.push({role:'user', content:text});
  saveMessages();
  inputEl.value = '';
  autoGrow();
  renderChat();

  const thinking = document.createElement('div');
  thinking.className = 'msg thinking';
  thinking.textContent = 'pensando...';
  chatEl.appendChild(thinking);
  chatEl.scrollTop = chatEl.scrollHeight;
  sendBtn.disabled = true;

  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: model,
        max_tokens: 1024,
        messages: messages.map(m => ({role: m.role, content: m.content}))
      })
    });

    const data = await res.json();
    thinking.remove();

    if(!res.ok){
      const detail = (data && data.error && data.error.message) ? data.error.message : ('HTTP ' + res.status);
      messages.push({role:'error', content:'Error: ' + detail});
    } else {
      const textOut = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('\n');
      messages.push({role:'assistant', content: textOut || '(sin respuesta de texto)'});
    }
  } catch(err){
    thinking.remove();
    messages.push({role:'error', content:'Error de red: ' + err.message});
  }

  saveMessages();
  renderChat();
  sendBtn.disabled = false;
  inputEl.focus();
}

// Settings panel
function openSettingsPanel(){
  document.getElementById('apiKey').value = apiKey;
  document.getElementById('modelSelect').value = model;
  overlay.classList.add('open');
}
document.getElementById('openSettings').addEventListener('click', openSettingsPanel);
document.getElementById('closeSettings').addEventListener('click', () => overlay.classList.remove('open'));

document.getElementById('saveSettings').addEventListener('click', () => {
  apiKey = document.getElementById('apiKey').value.trim();
  model = document.getElementById('modelSelect').value;
  localStorage.setItem(STORAGE_KEY, apiKey);
  localStorage.setItem(MODEL_KEY, model);
  updateReadout();
  overlay.classList.remove('open');
  renderChat();
});

document.getElementById('clearChat').addEventListener('click', () => {
  if(confirm('¿Borrar toda la conversación? Esto no se puede deshacer.')){
    messages = [];
    saveMessages();
    renderChat();
    overlay.classList.remove('open');
  }
});

// Init
updateReadout();
renderChat();

// PWA: registrar service worker
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
